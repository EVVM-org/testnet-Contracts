name: Test and Generate Interfaces

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-and-generate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install Bun
        uses: oven-sh/setup-bun@v1
        with:
          version: latest

      - name: Install Foundry dependencies
        run: forge install

      - name: Install Bun dependencies
        run: bun install --no-cache

      - name: Run tests
        run: forge test -vv

      - name: Generate interfaces
        run: |
          mkdir -p src/interfaces
          
          declare -A contracts=(
            ["Core"]="core"
            ["NameService"]="nameService"
            ["P2PSwap"]="p2pSwap"
            ["Staking"]="staking"
            ["Estimator"]="staking"
            ["Treasury"]="treasury"
            ["TreasuryExternalChainStation"]="treasuryTwoChains"
            ["TreasuryHostChainStation"]="treasuryTwoChains"
          )
          
          for contract in "${!contracts[@]}"; do
            folder="${contracts[$contract]}"
            echo "Generating interface for $contract..."
            
            cast interface "src/contracts/$folder/$contract.sol" | \
              sed 's|^// SPDX-License-Identifier:.*$|// SPDX-License-Identifier: EVVM-NONCOMMERCIAL-1.0\n// Full license terms available at: https://www.evvm.info/docs/EVVMNoncommercialLicense|' | \
              sed 's/pragma solidity \^0.8.4;/pragma solidity ^0.8.0;/' | \
              sed "s/interface $contract {/interface I$contract {/" \
              > "src/interfaces/I${contract}.sol"
            
            echo "I${contract}.sol generated at src/interfaces/I${contract}.sol"
          done
          
          echo "Contract interface generation completed"

      - name: Upload interfaces artifact
        uses: actions/upload-artifact@v4
        with:
          name: contract-interfaces
          path: src/interfaces/
          retention-days: 30
